spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mvc:
    log-request-details: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr(${spring.application.name}){blue} %clr(%msg){%-5level} %n"
  level:
    web: error
    "[io.github.danilotomassoni.core_hub.auth_service]": debug

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true

management:
  info:
    os:
      enabled: true
    java:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "info, health"
