spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: admin
    password: admin
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  mvc:
    log-request-details: true
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr(${spring.application.name}){blue} %clr(%msg){%-5level} %n"
  level:
    web: error
    "[io.github.danilotomassoni.core_hub.user_service]": debug

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: "info, health"
