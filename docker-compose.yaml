services:
  user-service:
    image: postgres:17-alpine
    container_name: user_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    networks:
      - db
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  auth-service:
    image: postgres:17-alpine
    container_name: auth_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    networks:
      - db
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  product-service:
    image: postgres:17-alpine
    container_name: product_container
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    networks:
      - db
    volumes:
      - product_postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - db
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - user-service
      - auth-service
      - product-service
    networks:
      - db

networks:
  db:
    driver: bridge

volumes:
  user_postgres_data:
  auth_postgres_data:
  product_postgres_data:
  rabbitmq_data:
